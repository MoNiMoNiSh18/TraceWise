
services:
  postgres:
    image: postgres:17-alpine
    container_name: tracewise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tracewise_db}
      POSTGRES_USER: ${POSTGRES_USER:-tracewise_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracewise_dev_password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
